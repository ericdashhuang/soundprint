name: Keep backend warm

# Render's free plan spins each web service down independently after ~15
# minutes of inactivity. The frontend and backend are separate free-tier
# services (see render.yaml), so a visitor loading an already-warm frontend
# can still hit a ~50s cold boot on their first real API call (artist
# autocomplete or round-start) if the backend fell asleep - confirmed live:
# a health check after idle time took 51s, the next one 0.13s. Pinging the
# backend well under that 15-minute window keeps it from ever spinning down.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: curl -fsS --max-time 60 https://album-flow-backend.onrender.com/api/health
